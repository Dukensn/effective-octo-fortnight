<script>
/* ===================== ATELYE : début du kit JS à copier ===================== */
var LV = {
  TRACK: { "Tèks": "#D97757", "Imaj": "#5B8DEF", "Tranz.": "#9B7BE8", "Son": "#4CB98A", "Mizik": "#E2B23C", "Vwa": "#1B1A18" },
  LANES: ["Tèks", "Imaj", "Tranz.", "Son", "Mizik"],
  laneX: function (i) { return 290 + i * 136; },
  el: function (host, cls, css, html) { var d = document.createElement("div"); d.className = cls; if (css) d.style.cssText = css; if (html != null) d.innerHTML = html; host.appendChild(d); return d; },
  tpl: function (id) { return document.getElementById(id).innerHTML; },
  /* caméra 2D : amène le point monde (x, y) au centre de scène (540, 760), échelle s, flou b px écran */
  cam: function (worldEl, c) {
    worldEl.style.transform = "translate(" + (540 - c.x * c.s).toFixed(2) + "px," + (760 - c.y * c.s).toFixed(2) + "px) scale(" + c.s.toFixed(4) + ")";
    worldEl.style.filter = c.b > 0.25 ? "blur(" + c.b.toFixed(1) + "px)" : "none";
  },
  /* la bande : panneau, règle (ticks tous les 60 px), libellés {y: texte}, couloirs optionnels */
  bande: function (host, o) {
    var y0 = o.y0, y1 = o.y1, s = LV.el(host, "lv-strip", "top:" + y0 + "px;height:" + (y1 - y0) + "px"), i, y, r = { strip: s, labels: {}, lanes: [] };
    for (i = 0, y = y0 + 20; y < y1 - 10; y += 60, i++) LV.el(host, "lv-tick" + (i % 4 === 0 ? " big" : ""), "left:" + (i % 4 === 0 ? 202 : 214) + "px;top:" + y + "px;width:" + (i % 4 === 0 ? 28 : 16) + "px");
    Object.keys(o.labels || {}).forEach(function (k) { r.labels[k] = LV.el(host, "lv-rlab", "top:" + (+k - 14) + "px", o.labels[k]); });
    if (o.lanes) LV.LANES.forEach(function (n, j) {
      LV.el(host, "lv-lhead", "left:" + LV.laneX(j) + "px;top:" + (o.lanes.top - 50) + "px", n);
      r.lanes.push(LV.el(host, "lv-lane", "left:" + LV.laneX(j) + "px;top:" + o.lanes.top + "px;height:" + o.lanes.h + "px"));
    });
    return r;
  },
  clip: function (host, lane, top, h, label) {
    return LV.el(host, "lv-clip", "left:" + LV.laneX(LV.LANES.indexOf(lane)) + "px;top:" + top + "px;height:" + h + "px;background:" + LV.TRACK[lane], label || "");
  },
  chip: function (host, css, label, dotColor, glyph) {
    return LV.el(host, "lv-chip", css, '<span class="dot" style="background:' + dotColor + '">' + (glyph || "") + "</span>" + label);
  },
  /* sous-titre : words = [["mot", "n"|"box"|"peak"], ...] ; renvoie les spans dans l'ordre (box/peak : span externe) */
  sub: function (host, words, dark) {
    var d = LV.el(host, "lv-sub" + (dark ? " dark" : ""), ""), out = [];
    words.forEach(function (w, i) {
      var sp = document.createElement("span"); sp.className = "lv-sw";
      if (w[1] === "box") sp.innerHTML = '<span class="lv-box"><span class="lv-box-bg"></span><span class="lv-box-tx">' + w[0] + "</span></span>";
      else if (w[1] === "peak") sp.innerHTML = '<span class="lv-peak">' + w[0] + '<span class="lv-peak-st"></span></span>';
      else sp.textContent = w[0];
      d.appendChild(sp); if (i < words.length - 1) d.appendChild(document.createTextNode(" ")); out.push(sp);
    });
    return { el: d, words: out };
  }
};
/* ===================== ATELYE : fin du kit JS ===================== */

/* ---- démos (états de référence du storyboard) ---- */

    LV.clip(w, "Tèks", 850, 170, "Tèks"); LV.clip(w, "Imaj", 1040, 220, "Imaj");

    var cl = LV.el(st, "lv-claude", "left:110px;top:80px;transform:scale(.7);transform-origin:0 0", '<div class="hd"><span style="width:58px;height:58px;display:block">' + LV.tpl("lv-logo-claude") + '</span>Claude</div><div class="ub">Fè yon pub videyo 9:16 pou Atelye Dijital, ak vwa m.</div><div class="in">Chat with Claude</div>');
    LV.el(st, "lv-cursor", "left:700px;top:1020px", LV.tpl("lv-cursor"));
  } else if (name === "sub") {
