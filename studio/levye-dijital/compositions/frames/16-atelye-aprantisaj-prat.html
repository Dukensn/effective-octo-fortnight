      /* sous-titres mot à mot (sub()/words() du pilote ; "group" = une boîte sur plusieurs mots, chacun sur son repère) */
      function sub(host, words) {
        var out = [];
        words.forEach(function (w, i) {
          if (w[2] === "group") {
            var bx = document.createElement("span"); bx.className = "lv-box";
            bx.innerHTML = '<span class="lv-box-bg"></span><span class="lv-box-tx"></span>';
            var tx = bx.querySelector(".lv-box-tx");
            w[0].forEach(function (g, j) {

              out.push({ el: gs, t: g[1], bg: j === 0 ? bx.querySelector(".lv-box-bg") : null });
            });
            host.appendChild(bx);
          } else {
            var sp = document.createElement("span"); sp.className = "lv-sw";
            if (w[2] === "box") sp.innerHTML = '<span class="lv-box"><span class="lv-box-bg"></span><span class="lv-box-tx">' + w[0] + "</span></span>";
            else sp.textContent = w[0];
            host.appendChild(sp);
            out.push({ el: sp, t: w[1], box: w[2] === "box" });
          }
          if (i < words.length - 1) host.appendChild(document.createTextNode(" "));
        });
        return out;
