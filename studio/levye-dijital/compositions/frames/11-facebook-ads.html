      /* sous-titres mot à mot (sub()/words() du pilote ; "group" = une boîte sur plusieurs mots, chacun sur son repère) */
      function sub(host, words) {
        var out = [];
        words.forEach(function (w, i) {
          if (w[2] === "group") {
            var bx = document.createElement("span"); bx.className = "lv-box";
            bx.innerHTML = '<span class="lv-box-bg"></span><span class="lv-box-tx"></span>';

            });
            host.appendChild(bx);

            var sp = document.createElement("span"); sp.className = "lv-sw";

            out.push({ el: sp, t: w[1], box: w[2] === "box" });

        return out;

      /* --- 2.93 « Ads » : la carte Ads Manager s'ouvre --- */
