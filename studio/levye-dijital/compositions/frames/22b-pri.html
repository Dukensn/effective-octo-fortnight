  <script>
    (function () {
      var FID = "22b-pri", T = 3.00;
      var $ = function (id) { return document.getElementById(id); };

      /* la grille 30/30 de la frame 22, déjà allumée (état handoff_in) */
      var seats = [];
      for (var i = 0; i < 30; i++) {
        var s = document.createElement("div"); s.className = "f22b-seat";

        $("f22b-grid").appendChild(s); seats.push(s);
      }

      function sub(host, words) {
        var out = [];
        words.forEach(function (w, i) {
          var sp = document.createElement("span"); sp.className = "lv-sw";
          if (w[2] === "box") sp.innerHTML = '<span class="lv-box"><span class="lv-box-bg"></span><span class="lv-box-tx">' + w[0] + "</span></span>";
          else sp.textContent = w[0];
          host.appendChild(sp); if (i < words.length - 1) host.appendChild(document.createTextNode(" "));
          out.push({ el: sp, t: w[1], box: w[2] === "box" });
        });
        return out;
      }
      var S1 = sub($("f22b-s1"), [["Pou", 0.12], ["patisipe,", 0.28]]);
      /* « 95 dola. » : deux boîtes jointives = une seule boîte */
      var S2 = sub($("f22b-s2"), [["w", 0.97], ["ap", 1.08], ["peye", 1.30], ["95", 1.56, "box"], ["dola.", 2.10, "box"]]);

      var tl = gsap.timeline({ paused: true });

      /* --- caméra : reprend la dérive de la frame 22 --- */

      tl.fromTo("#f22b-floor", { backgroundPosition: "0px 120px" }, { backgroundPosition: "0px 180px", duration: T, ease: "none" }, 0);
      tl.fromTo("#f22b-giant", { x: 0 }, { x: -80, duration: T, ease: "none" }, 0);
      tl.set("#f22b-mapg", { filter: "blur(9px)", opacity: 0.6, scale: 0.97 }, 0);

      /* --- 0.06 « Pou » : l'horloge et la porte s'en vont, la grille recule et se floute --- */
      tl.to(["#f22b-clk", "#f22b-door"], { opacity: 0, scale: 0.8, filter: "blur(8px)", duration: 0.2, ease: "power2.in" }, 0.06);
      tl.fromTo("#f22b-panel", { scale: 1, filter: "blur(0px)", opacity: 1 }, { scale: 0.88, filter: "blur(10px)", opacity: 0.45, duration: 0.4, ease: "power3.out" }, 0.10);

      /* --- 0.28 « patisipe » : la carte-ticket arrive trop grande et floue, se pose --- */
      tl.fromTo("#f22b-tk", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, 0.26);
      tl.fromTo("#f22b-tk", { y: 0 }, { y: 4, duration: 0.06, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 0.44);
      tl.fromTo("#f22b-tkl", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.14, ease: "expo.out" }, 0.36);
      tl.fromTo("#f22b-perf", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 0.40);
      tl.fromTo("#f22b-foot", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.14, ease: "expo.out" }, 0.50);

      /* --- 1.56 « 95 » : le chiffre tombe, anneau accent --- */
      tl.fromTo("#f22b-num", { opacity: 0, scale: 1.6, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out", immediateRender: false }, 1.53);
      tl.fromTo("#f22b-ring", { opacity: 0.9, scale: 0.5 }, { opacity: 0, scale: 1.5, duration: 0.6, ease: "expo.out", immediateRender: false }, 1.58);
      tl.to("#f22b-tk", { scale: 1.02, duration: 0.09, ease: "power2.out", yoyo: true, repeat: 1 }, 1.62);
      /* --- 2.10 « dola » --- */
      tl.fromTo("#f22b-cur", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "expo.out", immediateRender: false }, 2.07);

      /* --- 2.62 la carte s'efface, la grille revient nette (état handoff_out) --- */
      tl.to("#f22b-tk", { opacity: 0, scale: 0.9, filter: "blur(10px)", duration: 0.22, ease: "power2.in" }, 2.55);
      tl.to("#f22b-panel", { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.3, ease: "expo.out" }, 2.70);

      function words(list, out) {
        list.forEach(function (w) {
          tl.fromTo(w.el, { opacity: 0, y: 18, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, Math.max(0, w.t - 0.03));
          if (w.box) tl.fromTo(w.el.querySelector(".lv-box-bg"), { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "expo.out" }, Math.max(0, w.t - 0.04));
        });
        tl.to(list.map(function (w) { return w.el; }), { opacity: 0, y: -10, duration: 0.12, ease: "power2.in" }, out);
      }
      words(S1, 0.85);
      words(S2, 2.85);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
