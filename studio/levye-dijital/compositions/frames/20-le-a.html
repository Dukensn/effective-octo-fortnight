  <script>
    (function () {
      var FID = "20-le-a", T = 2.40;
      var $ = function (id) { return document.getElementById(id); };
      var NS = "http://www.w3.org/2000/svg";

      /* cadran : 60 graduations, 12 heures en encre */
      for (var k = 0; k < 60; k++) {
        var a = k * 6 * Math.PI / 180, major = k % 5 === 0, r1 = major ? 258 : 276, r2 = 292;
        var ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", (310 + r1 * Math.sin(a)).toFixed(2)); ln.setAttribute("y1", (310 - r1 * Math.cos(a)).toFixed(2));

        ln.setAttribute("stroke-linecap", "round"); ln.setAttribute("class", major ? "f20-tk f20-tkM" : "f20-tk");
        $("f20-ticks").appendChild(ln);
      }
      /* règle de la bande (graduations grises) */
      for (var j = 0; j < 22; j++) {
        var rt = document.createElement("div"); rt.className = "f20-rt"; rt.style.top = (70 + j * 48) + "px";
        if (j % 4 === 0) rt.style.width = "32px";
        $("f20-ruler").appendChild(rt);
      }

      function sub(host, words) {
        var out = [];
        words.forEach(function (w, i) {
          var sp = document.createElement("span"); sp.className = "lv-sw";
          if (w[2] === "box") sp.innerHTML = '<span class="lv-box"><span class="lv-box-bg"></span><span class="lv-box-tx">' + w[0] + "</span></span>";
          else sp.textContent = w[0];
          host.appendChild(sp); if (i < words.length - 1) host.appendChild(document.createTextNode(" "));
          out.push({ el: sp, t: w[1], box: w[2] === "box" });
        });
        return out;
      }
      function brk(list, i) { list[i].el.parentNode.insertBefore(document.createElement("br"), list[i].el); }
      var S1 = sub($("f20-s1"), [["10è", 0.17, "box"], ["nan", 0.37], ["maten", 0.59], ["pou", 0.94], ["rive", 1.24], ["4è", 1.50], ["nan", 1.82], ["apremidi.", 2.04]]);
      brk(S1, 5);

      var tl = gsap.timeline({ paused: true });

      /* --- caméra : arrive en descente floue (handoff_in), dérive, léger recul final --- */
      tl.fromTo("#f20-cam", { y: 90, scale: 1, filter: "blur(6px)" }, { y: 0, filter: "blur(0px)", duration: 0.26, ease: "expo.out" }, 0);
      tl.fromTo("#f20-cam", { scale: 1 }, { scale: 1.035, y: -24, duration: 2.1, ease: "none", immediateRender: false }, 0.26);
      tl.to("#f20-cam", { scale: 0.97, y: -10, duration: 0.3, ease: "power2.in" }, 2.10);
      tl.fromTo("#f20-floor", { backgroundPosition: "0px 0px" }, { backgroundPosition: "0px 120px", duration: T, ease: "none" }, 0);
      tl.fromTo("#f20-giant", { x: 0 }, { x: -80, duration: T, ease: "none" }, 0);
      tl.fromTo("#f20-ruler", { y: 60 }, { y: -40, duration: T, ease: "none" }, 0);

      /* --- 0.05 l'horloge arrive trop grande et floue, se pose --- */
      tl.fromTo("#f20-clock", { opacity: 0, scale: 1.18, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.18, ease: "expo.out" }, 0.05);
      tl.fromTo(".f20-tkM", { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none", stagger: 0.012 }, 0.10);
      /* --- 0.17 « 10è » : les aiguilles se posent sur 10:00 --- */
      tl.fromTo("#f20-hh", { opacity: 0, rotation: 300, svgOrigin: "310 310", scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.16, ease: "expo.out" }, 0.17);
      tl.fromTo("#f20-mh", { opacity: 0, rotation: 0, svgOrigin: "310 310", scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.16, ease: "expo.out" }, 0.17);
      tl.fromTo(["#f20-cap", "#f20-cap2"], { opacity: 0 }, { opacity: 1, duration: 0.1, ease: "none" }, 0.20);
      tl.fromTo("#f20-am", { opacity: 0, scale: 1.3, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out" }, 0.24);
      /* --- 0.59 « maten » : petit tic de l'aiguille --- */
      tl.to("#f20-hh", { rotation: 304, svgOrigin: "310 310", duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1 }, 0.59);
      /* --- 0.94 « pou » : la flèche se trace vers la droite --- */
      tl.fromTo("#f20-arrow", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "expo.out" }, 0.94);
      tl.fromTo("#f20-arrowh", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.24, ease: "expo.out" }, 1.06);
      /* --- 1.24 « rive » : l'aiguille prend son élan --- */
      tl.to("#f20-hh", { rotation: 294, svgOrigin: "310 310", duration: 0.24, ease: "power2.out" }, 1.24);
      /* --- 1.50 « 4è » : l'aiguille tourne jusqu'à 4, l'arc accent se remplit --- */
      tl.to("#f20-hh", { rotation: 480, svgOrigin: "310 310", duration: 0.5, ease: "power3.inOut" }, 1.50);
      tl.to("#f20-mh", { rotation: 720, svgOrigin: "310 310", duration: 0.5, ease: "power3.inOut" }, 1.50);
      tl.fromTo("#f20-arc", { strokeDashoffset: 722.57 }, { strokeDashoffset: 0, duration: 0.5, ease: "power3.inOut" }, 1.50);
      tl.fromTo("#f20-pm", { opacity: 0, scale: 1.3, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.16, ease: "expo.out" }, 1.58);
      tl.to("#f20-am", { opacity: 0.55, duration: 0.3, ease: "power2.out" }, 1.70);
      tl.to("#f20-clock", { scale: 1.03, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, 2.00);
      /* --- 2.10 la bande commence à se replier (handoff_out) --- */
      tl.fromTo("#f20-band", { rotationX: 0, transformPerspective: 1600, transformOrigin: "50% 100%" }, { rotationX: 38, duration: 0.3, ease: "power2.in" }, 2.10);

      function words(list, out) {
        list.forEach(function (w) {
          tl.fromTo(w.el, { opacity: 0, y: 18, filter: "blur(4px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.12, ease: "expo.out" }, Math.max(0, w.t - 0.03));
          if (w.box) tl.fromTo(w.el.querySelector(".lv-box-bg"), { scaleX: 0 }, { scaleX: 1, duration: 0.14, ease: "expo.out" }, Math.max(0, w.t - 0.04));
        });
        tl.to(list.map(function (w) { return w.el; }), { opacity: 0, y: -10, duration: 0.12, ease: "power2.in" }, out);
      }
      words(S1, 2.28);
